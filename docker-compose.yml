# One command to run the whole Pulse stack locally:
#   docker compose up --build
# Dashboard: http://localhost:8080  (sign in with demo@pulse.dev / demo-password)
# API: http://localhost:4000   Demo shop: http://localhost:5000
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./server
    environment: &server-env
      MONGO_URL: mongodb://mongo:27017/pulse
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
    ports: ["4000:4000"]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 10

  worker:
    build: ./server
    command: ["node", "src/worker.js"]
    environment: *server-env
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      replicas: 2   # workers share the load through the Redis consumer group

  # Creates the demo account and project once, with 24 hours of history.
  seed:
    build: ./server
    command: ["node", "src/scripts/seed.js"]
    environment:
      <<: *server-env
      PULSE_API_KEY: ${DEMO_API_KEY:-pk_local_demo_key_change_me}
      DEMO_USER_EMAIL: demo@pulse.dev
      DEMO_USER_PASSWORD: ${DEMO_PASSWORD:-demo-password}
      BACKFILL_HOURS: 24
    depends_on:
      mongo: { condition: service_healthy }
    restart: "no"

  demo:
    build:
      context: .
      dockerfile: demo-app/Dockerfile
    environment:
      PULSE_API_KEY: ${DEMO_API_KEY:-pk_local_demo_key_change_me}
      PULSE_ENDPOINT: http://api:4000
      DEMO_RPS: 2
    ports: ["5000:5000"]
    depends_on:
      api: { condition: service_healthy }
      seed: { condition: service_completed_successfully }

  dashboard:
    build: ./dashboard
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  mongo-data:
