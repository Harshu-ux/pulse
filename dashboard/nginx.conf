server {
  listen 80;
  root /usr/share/nginx/html;

  # Dashboard API, SDK ingestion and live updates all go to the Pulse API.
  location /api/ { proxy_pass http://api:4000; proxy_set_header X-Forwarded-For $remote_addr; }
  location /v1/  { proxy_pass http://api:4000; proxy_set_header X-Forwarded-For $remote_addr; client_max_body_size 1m; }
  location /ws {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  # Hashed build assets can be cached forever.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  # Single-page app: every other path serves index.html.
  location / { try_files $uri /index.html; }
}
